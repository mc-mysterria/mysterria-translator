debug: false
defaultLang: en_us

storage:
  # yaml, sqlite or mysql; players.yml is imported once when switching to a database
  type: yaml
  mysql:
    host: localhost
    port: 3306
    database: mtranslator
    user: root
    password: password
    properties:
      autoReconnect: true
      useSSL: false
      connectTimeout: 5000
      characterEncoding: utf8

translation:
  enabled: true
  # engines tried left to right: ollama, libretranslate, gemini, google, openai
  provider: "ollama"
  minMessageLength: 3
  maxRetries: 2
  cacheExpirySeconds: 600
  rateLimitMessages: 4
  rateLimitWindowSeconds: 10
  rateLimitSuspensionMinutes: 20
  retryDelayMillis: 1000
  overallTimeoutSeconds: 60
  connectTimeoutSeconds: 10
  threadPool:
    size: 6
    queueCapacity: 256
  indicator:
    enabled: true
    text: "&bᵀ "
    # {original}, {source}, {target}
    hover:
      - "&7Original: &f{original}"
      - "&8Automatically translated ({source} → {target})"
      - "&8Wording may be imperfect."

engines:
  ollama:
    url: "https://ollama.mysterria.net"
    model: "gemma2:2b"
    apiKey: ""
    # seconds
    requestTimeout: 90
  libretranslate:
    url: "https://libre.mysterria.net/translate"
    apiKey: ""
    alternatives: 3
    format: "text"
    readTimeout: 10
  gemini:
    apiKeys:
      - "your-gemini-api-key-1"
    model: "gemini-2.0-flash"
    includeContext: true
    readTimeout: 15
  google:
    readTimeout: 10
  openai:
    apiKey: "sk-..."
    model: "gpt-4o-mini"
    baseUrl: "https://api.openai.com/v1"
    readTimeout: 30
    maxTokens: 1000
    useLegacyMaxTokens: false
    useTemperature: true
    temperature: 0.3
    useTopP: true
    topP: 0.9

chat:
  globalChat:
    enabled: true
    prefix: "!"
    removePrefix: true
  rangeChat:
    enabled: true
    range: 100.0
    crossWorld: false

zelchat:
  display:
    showHover: true
  translatePrivateMessages: true
  channelPrefixes:
    - "#"
  rangeChat:
    format:
      # {message} plus legacy codes, &#RRGGBB, MiniMessage and %papi%; empty keeps ZelChat's format
      message: "&c&l[R] &f%player_name% &8➠ &f{message}"
      hover: |
        &#25c8fa&lINFO
        &#25c8fa&l▮&r &7ᴘɪɴɢ &f%player_ping%ms
        &#25c8fa&l→ &rᴄʟɪᴄᴋ ᴛᴏ sᴇɴᴅ ᴀ ᴘʀɪᴠᴀᴛᴇ ᴍᴇssᴀɢᴇ
      # SUGGEST_COMMAND:/cmd, RUN_COMMAND:/cmd or OPEN_URL:https://...
      action: "SUGGEST_COMMAND:/msg %player_name%"

chatcontrol:
  display:
    showHover: true
  globalChat:
    format: "&8[&bГ&8] %luckperms_prefix%&f{player_name}&7 >> &f{translated_message}"
    consoleFormat: "&8[&bDiscord&8] &f{player_name}&7 >> &f{translated_message}"
  rangeChat:
    format: "&8[&eР&8] %luckperms_prefix%&f{player_name}&7 >> &f{translated_message}"
    consoleFormat: "&8[&eР&8] &f{player_name}&7 >> &f{translated_message}"
  privateMessage:
    format: "&8[&eТ&8] %luckperms_prefix%&f{player_name}&7 >> &f{translated_message}"
