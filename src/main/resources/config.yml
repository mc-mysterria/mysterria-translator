# ================================================== #
#              MysterriaTranslator                   #
#         Multi-language plugin for Minecraft        #
# ================================================== #

# Enable verbose debug logging.
debug: true

# Default language used when a player's language is not set.
defaultLang: en_us

# Number of static translation entries to keep in the LRU cache.
translationCacheSize: 500

# -------------------------------------------------- #
#                     Storage                        #
# -------------------------------------------------- #
storage:
  # type: yaml | sqlite | mysql
  # YAML data is automatically migrated to sqlite/mysql on first use.
  type: yaml
  mysql:
    host: localhost
    port: 3306
    database: mtranslator
    user: root
    password: password
    properties:
      autoReconnect: true
      useSSL: false
      connectTimeout: 5000
      characterEncoding: utf8

# -------------------------------------------------- #
#               Translation (core)                   #
# -------------------------------------------------- #
translation:
  # Master switch — disable to stop all real-time chat translation.
  enabled: true

  # Provider order, comma-separated. Tried left-to-right with automatic fallback.
  # Supported: ollama, libretranslate, gemini, google, openai
  # Examples:
  #   provider: "gemini"           — single provider, no fallback
  #   provider: "gemini, google"   — Gemini first, Google Translate as fallback
  provider: "ollama"

  # Minimum typed characters before translation is attempted.
  minMessageLength: 3
  # Maximum translation attempts per message before giving up.
  maxRetries: 2
  # How long (seconds) a translation result is cached.
  cacheExpirySeconds: 30
  # Maximum messages per player within the window before rate-limiting.
  rateLimitMessages: 2
  rateLimitWindowSeconds: 10
  # How long (minutes) to suspend an engine after receiving HTTP 429.
  rateLimitSuspensionMinutes: 20
  # Back-off before retrying the same engine, multiplied by the attempt number.
  retryDelayMillis: 1000
  # Hard ceiling for one message's whole provider chain (all fallbacks and retries).
  # Safety net so a stalled engine can never hold up chat delivery.
  overallTimeoutSeconds: 60
  # Extra debug output for translation events.
  debug: true

  # Every provider call runs on this pool. It caps both the number of threads and the
  # number of requests in flight — translation must never run on the JVM common pool,
  # which spawns a new compensation thread for every blocked worker.
  threadPool:
    # Concurrent provider requests. Raise if chat is busy and translations lag behind;
    # lower if the engine is rate-limiting you.
    size: 6
    # Requests waiting for a free thread. Beyond this, messages are delivered
    # untranslated rather than queueing without bound.
    queueCapacity: 256

  # Marks machine-translated messages so players can tell them apart from what the
  # sender actually typed — automatic translations often read a little oddly.
  indicator:
    # Master switch for both the glyph and its hover.
    enabled: true
    # Inserted immediately before the translated text.
    text: "&bᵀ "
    # Hover shown on the translated text, one entry per line.
    # Placeholders: {original}, {source}, {target}
    hover:
      - "&7Original: &f{original}"
      - "&8Automatically translated ({source} → {target})"
      - "&8Wording may be imperfect."

# -------------------------------------------------- #
#              Translation Engines                   #
# -------------------------------------------------- #
engines:

  ollama:
    url: "https://ollama.mysterria.net"
    model: "gemma2:2b"   # Recommended: qwen2.5:3b or gemma2:2b
    apiKey: ""            # Optional Bearer token for authenticated instances
    connectTimeout: 10    # seconds
    requestTimeout: 90    # seconds — AI inference can be slow

  libretranslate:
    url: "https://libre.mysterria.net/translate"
    apiKey: "your-api-key-here"
    alternatives: 3
    format: "text"        # "text" or "html"
    connectTimeout: 5
    readTimeout: 10

  gemini:
    # Add multiple API keys for better rate-limit resilience.
    apiKeys:
      - "your-gemini-api-key-1"
      - "your-gemini-api-key-2"
    model: "gemini-1.5-flash"
    # Pass online player names as context so the model avoids translating them.
    includeContext: true
    connectTimeout: 10
    readTimeout: 15

  google:
    # Unofficial free Google Translate endpoint — no API key required.
    # May be rate-limited under heavy load; use Gemini as primary if possible.
    connectTimeout: 5
    readTimeout: 10

  openai:
    apiKey: "sk-..."
    model: "gpt-4o-mini"   # gpt-4o, gpt-4o-mini, gpt-4-turbo, gpt-3.5-turbo, o1, o3
    baseUrl: "https://api.openai.com/v1"
    connectTimeout: 10
    readTimeout: 30
    maxTokens: 1000
    # Set true to use legacy 'max_tokens' instead of 'max_completion_tokens' (for older models).
    useLegacyMaxTokens: false
    # Disable temperature / top_p for models that do not support them (o1, o3, etc.).
    useTemperature: true
    temperature: 0.3
    useTopP: true
    topP: 0.9

# -------------------------------------------------- #
#           Chat Routing  (shared by all             #
#          integrations: ZelChat, ChatControl,       #
#          and the Bukkit fallback)                  #
# -------------------------------------------------- #
chat:
  globalChat:
    # When true, only messages that start with `prefix` are treated as global chat.
    # Messages without the prefix are routed to range chat (if enabled below).
    enabled: true
    # The symbol that marks a global-chat message (e.g. player types "!Hello").
    prefix: "!"
    # Strip the prefix before the message is displayed / translated.
    removePrefix: true

  rangeChat:
    # When true, messages without the global prefix are delivered only to players
    # within `range` blocks of the sender.
    enabled: true
    # Delivery radius in blocks.
    range: 100.0
    # If false, only players in the same world receive range messages.
    crossWorld: false

# -------------------------------------------------- #
#          ZelChat Integration Settings              #
# -------------------------------------------------- #
zelchat:
  display:
    # Show a hover tooltip on translated messages with the original text.
    showHover: true

  # Prefixes that route to a ZelChat named channel (staff chat, admin chat, etc.).
  # Messages starting with any of these are passed through to ZelChat unchanged.
  # Only needed if the ChannelType.CUSTOM check doesn't catch them automatically.
  channelPrefixes:
    - "#"

  rangeChat:
    format:
      # Main message template.
      # Use {message} where the chat content should appear.
      # Supports legacy codes (&c, &l, &r…), hex colors (&#RRGGBB), and %papi% placeholders.
      # Leave as "" to use ZelChat's own format for the sender unchanged.
      #
      # Example:
      #   message: '&c&l[R] &f%player_name% &8➠ &f{message}'
      message: "&c&l[R] &f%player_name% &8➠ &f{message}"

      # Hover tooltip shown when hovering over the message.
      # Multi-line: use a YAML block scalar (|) and indent each line.
      # Supports legacy codes, hex colors, and %papi% placeholders.
      # Leave as "" for no hover.
      #
      # Example:
      #   hover: |
      #     &#25c8fa&lINFO
      #     &#25c8fa&l▮&r &7ᴘɪɴɢ &f%player_ping%ms
      #     &#25c8fa&l→ &rᴄʟɪᴄᴋ ᴛᴏ sᴇɴᴅ ᴀ ᴘʀɪᴠᴀᴛᴇ ᴍᴇssᴀɢᴇ
      hover: |
        &#25c8fa&lINFO
        &#25c8fa&l▮&r &7ᴘɪɴɢ &f%player_ping%ms
        &#25c8fa&l→ &rᴄʟɪᴄᴋ ᴛᴏ sᴇɴᴅ ᴀ ᴘʀɪᴠᴀᴛᴇ ᴍᴇssᴀɢᴇ

      # Click action performed when the message is clicked.
      # Format:  SUGGEST_COMMAND:/cmd   RUN_COMMAND:/cmd   OPEN_URL:https://...
      # %papi% placeholders are resolved for the sender.
      # Leave as "" for no click action.
      #
      # Example:
      #   action: "SUGGEST_COMMAND:/msg %player_name%"
      action: "SUGGEST_COMMAND:/msg %player_name%"

# -------------------------------------------------- #
#       ChatControl / Bukkit Fallback Settings       #
# -------------------------------------------------- #
chatcontrol:
  display:
    # How translations are shown to recipients.
    # Modes: separate | replace | compact | custom
    #   separate — original first, then translated
    #   replace  — translated replaces the original for that player
    #   compact  — translated inline with a hover for the original
    #   custom   — use the format strings defined below
    mode: "custom"

    # Prefix shown in separate/compact modes.
    prefix: "[T]"
    # Show original + language info in a hover tooltip.
    showHover: true
    # Color of the translation indicator in separate/compact modes.
    # Any named color: black, dark_blue, dark_green, dark_aqua, dark_red,
    #                  dark_purple, gold, gray, dark_gray, blue, green, aqua,
    #                  red, light_purple, yellow, white
    indicatorColor: "aqua"

  globalChat:
    # Format used for global-chat messages from a player.
    format: "&8[&bГ&8] {luckperms_prefix}&f{player_name}&7 >> &f{player_chat_color}{player_chat_decoration}{translated_message}"
    # Format used for global-chat messages from the console / Discord bridge.
    consoleFormat: "&8[&bDiscord&8] &f{player_name}&7 >> &f{translated_message}"

  rangeChat:
    # Format used for range-chat messages from a player.
    format: "&8[&eР&8] {luckperms_prefix}&f{player_name}&7 >> &f{player_chat_color}{player_chat_decoration}{translated_message}"
    # Format used for range-chat messages from the console.
    consoleFormat: "&8[&eР&8] &f{player_name}&7 >> &f{translated_message}"

  privateMessage:
    # Format used when a private message is translated for the recipient.
    # Available: {player_name}, {translated_message}, {original_message},
    #            {source_language}, {target_language}, any PAPI placeholder
    format: "&8[&eТ&8] {luckperms_prefix}&f{player_name}&7 >> &f{player_chat_color}{player_chat_decoration}{translated_message}"
